# tmux popup replacement: git branch --edit-description
[[keys.command]]
key = "prefix+ctrl+i"
type = "popup"
command = "$HOME/.config/herdr/popup-session.sh git-description"
description = "edit git branch description in popup Herdr session"
width = "95%"
